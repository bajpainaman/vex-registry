name: Publish the registry

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install vex
        run: cargo install --locked --git https://github.com/bajpainaman/vex --rev 443fd20
      - name: Check every published version
        run: vex registry verify --registry .
      - name: Build the site
        run: |
          mkdir -p _site
          cp -R index archives _site/
          cp site/* _site/
          vex registry json --registry . --output _site/packages.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
